# Publishes the app to GitHub Pages (https://fimstqrs.github.io/Manna/) every time main changes.
# The server parts (AI, accounts, sync, Friends) stay on Vercel; the page calls them there.
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static files
        run: |
          mkdir _site
          cp index.html version.json manifest.webmanifest robots.txt favicon.ico favicon.svg favicon-32.png apple-touch-icon.png _site/
          cp -r icons data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
